<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADVDourado WhatsApp IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { width: 350px; background: #0b1120; color: #f8fafc; padding: 16px; font-size: 13px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 16px; }
    .brand-title { font-size: 15px; font-weight: 700; color: #e2b34a; letter-spacing: 0.5px; }
    .brand-subtitle { font-size: 11px; color: #94a3b8; }
    
    .switch-container { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #334155; }
    .switch-label { font-weight: 600; color: #f1f5f9; }
    
    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 10px; border-radius: 6px; font-size: 12px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: #e2b34a; }
    
    .test-box { background: rgba(226, 179, 74, 0.08); border: 1px solid rgba(226, 179, 74, 0.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
    .test-box-title { font-size: 12px; font-weight: 700; color: #e2b34a; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
    .test-box-desc { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    
    .btn-save { width: 100%; background: linear-gradient(135deg, #e2b34a 0%, #c29532 100%); color: #0b1120; font-weight: 700; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: opacity 0.2s; }
    .btn-save:hover { opacity: 0.9; }
    
    .status-msg { margin-top: 10px; text-align: center; font-size: 11px; color: #10b981; min-height: 16px; font-weight: 600; }
    .footer { margin-top: 12px; text-align: center; font-size: 10px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="brand-title">ADVDourado IA</div>
      <div class="brand-subtitle">WhatsApp Assistant & Triagem</div>
    </div>
    <div style="font-size: 20px;">⚖️</div>
  </div>

  <div class="switch-container">
    <span class="switch-label">Automação do Bot</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="test-box">
    <div class="test-box-title">
      <span>Modo Testador (Diego)</span>
      <label class="switch" style="width: 36px; height: 20px;">
        <input type="checkbox" id="diegoTestMode">
        <span class="slider" style="border-radius: 20px;"></span>
      </label>
    </div>
    <div class="test-box-desc">
      Número <strong>71 98806-8222</strong> entra sempre no funil de teste. Digite "Oi" no WhatsApp para reiniciar o loop.
    </div>
  </div>

  <div class="form-group">
    <label for="backendUrl">URL do Backend ADVDourado</label>
    <input type="text" id="backendUrl" class="form-control" placeholder="https://advdourado.com.br">
  </div>

  <div class="form-group">
    <label for="geminiApiKey">Chave Gemini API (Opcional)</label>
    <input type="password" id="geminiApiKey" class="form-control" placeholder="AIzaSy...">
  </div>

  <div class="form-group">
    <label for="delaySeconds">Delay de Digitação (segundos)</label>
    <input type="number" id="delaySeconds" class="form-control" value="3" min="1" max="10">
  </div>

  <button id="saveBtn" class="btn-save">Salvar Configurações</button>
  <div id="statusMsg" class="status-msg"></div>

  <div class="footer">Dra. Bruna Dourado • OAB/BA 71507</div>

  <script src="popup.js"></script>
</body>
</html>

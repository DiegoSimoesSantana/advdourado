# Evolution API v2 - Configuração para Máquina Virtual (n8n + Docker)
# ADVDourado - Dra. Bruna Dourado Advocacia & Consultoria

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # URL onde a Evolution API está acessível na sua rede/VM
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=ADVDourado_Secret_Key_2025_Diego
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # Banco de dados interno da Evolution API (SQLite para facilidade ou PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=sqlite
      
      # Webhook Global Padrão (Aponta para o Webhook do seu n8n)
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://localhost:5678/webhook/advdourado-whatsapp
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_CONTACTS_SET=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      
      # Configurações de Mensagens e WhatsApp
      - CONFIG_SESSION_PHONE_CLIENT=ADVDourado
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:

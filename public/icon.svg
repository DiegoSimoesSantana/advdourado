<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="30" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFC69E" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7C56" />
    </linearGradient>
  </defs>

  <!-- Fundo Institucional Escuro -->
  <rect width="180" height="180" rx="38" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="164" height="164" rx="31" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.65" />
  <rect x="15" y="15" width="150" height="150" rx="25" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Eixo Superior: Balança da Justiça Estilizada -->
  <path d="M90 26V52" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="90" cy="25" r="4" fill="url(#goldGrad)" />
  <path d="M58 36H122" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Prato Esquerdo -->
  <path d="M58 36L50 50H66L58 36Z" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round" fill="#C5A880" fill-opacity="0.15" />
  <!-- Prato Direito -->
  <path d="M122 36L114 50H130L122 36Z" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round" fill="#C5A880" fill-opacity="0.15" />
  <!-- Base da Balança -->
  <path d="M78 52H102" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Monograma Serifado BD Central -->
  <text
    x="90"
    y="124"
    text-anchor="middle"
    fill="url(#goldGrad)"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-weight="700"
    font-size="68"
    letter-spacing="-2"
  >BD</text>

  <!-- Linha divisória e assinatura OAB -->
  <path d="M54 140H126" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.5" />
  <text
    x="90"
    y="154"
    text-anchor="middle"
    fill="#C5A880"
    font-family="Inter, Arial, sans-serif"
    font-weight="600"
    font-size="10.5"
    letter-spacing="3.5"
  >OAB/BA</text>
</svg>
